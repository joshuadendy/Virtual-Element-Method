[project]
name = "VEM"
version = "0.1.0"
description = "Finite and virtual element implementations for triangular meshes"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Josh D" }]
dependencies = [
  "numpy",
  "scipy",
  "dune_common",
  "dune_geometry",
  "dune_grid",
  "dune_alugrid",
  "cmake",
  "matplotlib",
]
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
# Single-letter matrix names (I, l) follow the mathematical notation.
ignore = ["E741"]
